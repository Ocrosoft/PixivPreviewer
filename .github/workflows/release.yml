name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-stable-release
  queue: max

jobs:
  tests:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish:
    needs: tests
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event.created && !github.event.deleted)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare and publish the stable userscript
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            TAG="v$(awk '$2 == "@version" {print $3; exit}' 'pixiv previewer.user.js')"
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable version tag such as v3.9.2." >&2
            exit 1
          fi
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1); then
            if [[ "$draft" != "release not found" ]]; then
              echo "$draft" >&2
              exit 1
            fi
            draft=missing
          fi
          if [[ "$draft" == false ]]; then
            echo "$TAG is already published."
            exit 0
          fi

          previous=$(gh release view --json tagName --jq .tagName)
          node .github/scripts/prepare-release.mjs "$TAG" "$previous" "$RUNNER_TEMP" HEAD
          asset="$RUNNER_TEMP/pixiv-previewer.user.js"
          notes="$RUNNER_TEMP/release-notes.md"
          node --check "$asset"
          echo >> "$notes"
          echo "[完整变更]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$TAG)" >> "$notes"

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag $TAG already points to another commit." >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            gh api --method POST 'repos/{owner}/{repo}/git/refs' \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          fi
          if [[ "$draft" == missing ]]; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file "$notes"
          fi
          gh release upload "$TAG" "$asset" --clobber
          gh release edit "$TAG" --notes-file "$notes" --draft=false --latest
